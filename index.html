<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ Tester (Paiza.IO API)</title>
    <style>
        :root {
            --vscode-font: Menlo, Monaco, Consolas, "Courier New", monospace;
        }

        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #1e1e1e; color: #d4d4d4; height: 100vh; box-sizing: border-box; }
        .container { display: flex; width: 100%; height: calc(100% - 40px); gap: 20px; }
        .left-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        
        .right-pane { width: 180px; flex-shrink: 0; display: flex; flex-direction: column; background: #252526; padding: 15px 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        .editor-container { position: relative; background-color: #1e1e1e; border: 1px solid #444; border-radius: 4px; display: flex; flex-direction: column; min-height: 0; }
        .editor-container:focus-within { border-color: #007acc; }
        #code-container { flex: 4; margin-bottom: 10px; }
        
        .highlight-layer, .code-textarea { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 15px; box-sizing: border-box; font-family: var(--vscode-font); font-size: 16px; line-height: 1.5; margin: 0; border: none; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        .highlight-layer { color: #d4d4d4; pointer-events: none; }
        .code-textarea { background: transparent; color: transparent; caret-color: #d4d4d4; resize: none; outline: none; }
        
        #sub-code1-container, #sub-code2-container, #sub-code3-container { flex: 1; }
        #sub-code1-container .highlight-layer, #sub-code1-container .code-textarea,
        #sub-code2-container .highlight-layer, #sub-code2-container .code-textarea,
        #sub-code3-container .highlight-layer, #sub-code3-container .code-textarea { padding: 10px; font-size: 14px;}
        
        #input-data { flex: 1; resize: none; padding: 10px 10px; font-family: var(--vscode-font); font-size: 14px; background-color: #1e1e1e; color: #d4d4d4; border: 1px solid #444; border-radius: 4px; line-height: 1.5; box-sizing: border-box; width: 100%; margin: 0; min-height: 0; }
        #input-data:focus { outline: none; border-color: #007acc; }
        
        .middle-controls { display: flex; gap: 10px; flex: 1.5; margin-bottom: 15px; min-height: 0; }
        .middle-box { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        
        .bottom-controls { display: flex; gap: 10px; flex-shrink: 0; height: 150px; }
        
        .button-group { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
        button { font-size: 14px; font-weight: bold; cursor: pointer; background-color: #007acc; color: white; border: none; border-radius: 4px; transition: background-color 0.2s, opacity 0.2s; margin: 0; width: 100%; height: 100%; min-height: 0; }
        button:hover { background-color: #005f9e; }
        button:disabled { background-color: #555 !important; cursor: not-allowed; opacity: 0.6; }
        button.sub-btn { background-color: #0f8f62; }
        button.sub-btn:hover { background-color: #0b6b49; }
        button.init-btn { background-color: #b33939; }
        button.init-btn:hover { background-color: #8b2c2c; }
        
        .input-wrapper { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .output-wrapper { flex: 2; display: flex; flex-direction: column; min-height: 0; } 
        
        .pane-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; flex-shrink: 0; }
        .pane-header h3 { margin: 0; font-size: 16px; color: #bbb; }
        h3 { margin-top: 0; margin-bottom: 8px; font-size: 16px; color: #bbb; flex-shrink: 0; }
        
        .stats { font-size: 12px; color: #888; font-family: var(--vscode-font); flex-shrink: 0; }
        .output-area { font-family: var(--vscode-font); flex: 1; background: #1e1e1e; padding: 10px 15px; border: 1px solid #444; border-radius: 4px; font-size: 14px; white-space: pre-wrap; overflow-y: auto; word-break: break-all; margin: 0; min-height: 0; color: #4ec9b0; }
        .output-area.error { color: #f48771; }
        
        .memory-header { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin-bottom: 10px; flex-shrink: 0; }
        
        .memory-container { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; padding-right: 2px; scroll-behavior: smooth; min-height: 0; }
        .memory-cell { width: 100%; min-height: 30px; display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; padding: 0 8px; border: 1px solid #555; background-color: #333; font-family: var(--vscode-font); border-radius: 4px; flex-shrink: 0; }
        .memory-cell.updated { border-color: #d48844; background-color: #4d3319; }
        .cell-index { color: #9cdcfe; font-size: 12px; font-weight: bold; font-family: var(--vscode-font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; }
        .cell-value { font-size: 14px; font-weight: bold; color: #ce9178; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; }
        
        .keyword { color: #569cd6; font-weight: bold; }
        .type { color: #4ec9b0; }
        .string { color: #ce9178; }
        .number { color: #b5cea8; }
        .comment { color: #6a9955; }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-pane">
            <div class="pane-header">
                <h3>Code</h3>
                <span id="code-stats" class="stats">Length: 0 | Pos: 0</span>
            </div>
            <div id="code-container" class="editor-container">
                <div id="code-highlight" class="highlight-layer"></div>
                <textarea id="code" class="code-textarea" spellcheck="false" placeholder="#include <bits/stdc++.h>&#10;using namespace std;&#10;&#10;int main() {&#10;    int a = 100;&#10;    string s = &quot;AtCoder&quot;;&#10;    cout << &quot;Result: &quot; << a << &quot;, &quot; << s << endl;&#10;    &#10;    // 変数を右ペインに表示させるデバッグ出力&#10;    cout << &quot;DEBUG:a=&quot; << a << endl;&#10;    cout << &quot;DEBUG:s=&quot; << s << endl;&#10;    return 0;&#10;}"></textarea>
            </div>
            
            <div class="middle-controls">
                <div class="middle-box">
                    <h3>追加実行1</h3>
                    <div id="sub-code1-container" class="editor-container">
                        <div id="sub-code1-highlight" class="highlight-layer"></div>
                        <textarea id="sub-code1" class="code-textarea" spellcheck="false" placeholder="#include <bits/stdc++.h>&#10;using namespace std;&#10;&#10;int main() {&#10;    int x = 42;&#10;    cout << &quot;DEBUG:x=&quot; << x << endl;&#10;}"></textarea>
                    </div>
                </div>
                <div class="middle-box">
                    <h3>追加実行2</h3>
                    <div id="sub-code2-container" class="editor-container">
                        <div id="sub-code2-highlight" class="highlight-layer"></div>
                        <textarea id="sub-code2" class="code-textarea" spellcheck="false" placeholder="#include <bits/stdc++.h>&#10;using namespace std;&#10;&#10;int main() {&#10;    // コード2&#10;}"></textarea>
                    </div>
                </div>
                <div class="middle-box">
                    <h3>追加実行3</h3>
                    <div id="sub-code3-container" class="editor-container">
                        <div id="sub-code3-highlight" class="highlight-layer"></div>
                        <textarea id="sub-code3" class="code-textarea" spellcheck="false" placeholder="#include <bits/stdc++.h>&#10;using namespace std;&#10;&#10;int main() {&#10;    // コード3&#10;}"></textarea>
                    </div>
                </div>
            </div>
            
            <div class="bottom-controls">
                <div class="button-group">
                    <button id="btn-sub1" class="sub-btn" onclick="runCode('sub-code1')">実行1</button>
                    <button id="btn-sub2" class="sub-btn" onclick="runCode('sub-code2')">実行2</button>
                    <button id="btn-sub3" class="sub-btn" onclick="runCode('sub-code3')">実行3</button>
                    <button id="btn-main" onclick="runCode('code')">Main RUN</button>
                    <button class="init-btn" onclick="resetUI()" style="grid-column: span 2;">UIクリア</button>
                </div>
                
                <div class="input-wrapper">
                    <div class="pane-header">
                        <h3>Input (cin用)</h3>
                    </div>
                    <textarea id="input-data" spellcheck="false" placeholder="標準入力データ..."></textarea>
                </div>
                
                <div class="output-wrapper">
                    <div class="pane-header output-header">
                        <h3>Console Output</h3>
                    </div>
                    <div id="output" class="output-area"></div>
                </div>
            </div>
        </div>

        <div class="right-pane">
            <div class="memory-header">
                <div style="font-size: 14px; color: #888; font-weight: bold; text-align: center;">抽出された変数</div>
                <div style="font-size: 10px; color: #555; text-align: center;">DEBUG:変数名=値 をフック</div>
            </div>
            <div id="memory" class="memory-container"></div>
        </div>
    </div>

    <script>
        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function highlightCPPSyntax(text) {
            let html = escapeHtml(text);
            html = html.replace(/(&quot;.*?&quot;)/g, '<span class="string">$1</span>');
            html = html.replace(/\b(int|float|double|char|string|auto|void|bool|long|long long|vector|map|set|pair)\b/g, '<span class="type">$1</span>');
            html = html.replace(/\b(return|if|else|for|while|include|using|namespace|cout|cin|endl)\b/g, '<span class="keyword">$1</span>');
            html = html.replace(/\b(\d+)\b/g, '<span class="number">$1</span>');
            html = html.replace(/(\/\/.*)/g, '<span class="comment">$1</span>');
            if (text.endsWith('\n')) html += ' ';
            return html;
        }

        function setupEditor(id) {
            const textarea = document.getElementById(id);
            const highlightDiv = document.getElementById(id + '-highlight');
            
            const update = () => {
                highlightDiv.innerHTML = highlightCPPSyntax(textarea.value);
                if (id === 'code') {
                    document.getElementById('code-stats').innerText = `Length: ${textarea.value.length} | Pos: ${textarea.selectionStart}`;
                }
            };

            ['input', 'keyup', 'click', 'focus'].forEach(evt => textarea.addEventListener(evt, update));

            textarea.addEventListener('scroll', () => {
                highlightDiv.scrollTop = textarea.scrollTop;
                highlightDiv.scrollLeft = textarea.scrollLeft;
            });

            textarea.addEventListener('keydown', function(e) {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = this.selectionStart;
                    const end = this.selectionEnd;
                    const val = this.value;
                    this.value = val.substring(0, start) + '    ' + val.substring(end);
                    this.selectionStart = this.selectionEnd = start + 4;
                    update();
                }
            });
            update(); 
        }

        let memoryVars = {};

        function renderMemoryDOM() {
            const memoryDiv = document.getElementById('memory');
            memoryDiv.innerHTML = '';
            
            if (Object.keys(memoryVars).length === 0) {
                memoryDiv.innerHTML = '<div style="color: #666; font-size: 12px; text-align: center; margin-top: 20px;">データなし</div>';
                return;
            }

            for (let vName in memoryVars) {
                let htmlString = `
                    <div id="var-${vName}" class="memory-cell updated">
                        <span class="cell-index">${escapeHtml(vName)}</span>
                        <span class="cell-value">${escapeHtml(String(memoryVars[vName]))}</span>
                    </div>`;
                memoryDiv.insertAdjacentHTML('beforeend', htmlString);
                
                setTimeout(() => {
                    let cell = document.getElementById(`var-${vName}`);
                    if (cell) cell.classList.remove('updated');
                }, 500);
            }
        }

        function resetUI() {
            memoryVars = {};
            const outputDiv = document.getElementById('output');
            outputDiv.innerText = '';
            outputDiv.classList.remove('error');
            renderMemoryDOM();
        }

        function setButtonsState(disabled, message = '') {
            const buttons = document.querySelectorAll('.button-group button');
            buttons.forEach(btn => {
                btn.disabled = disabled;
                if (disabled && message && btn.id === 'btn-main') {
                    btn.setAttribute('data-prev-text', btn.innerText);
                    btn.innerText = message;
                } else if (!disabled && btn.hasAttribute('data-prev-text')) {
                    btn.innerText = btn.getAttribute('data-prev-text');
                }
            });
        }

        async function runCode(editorId) {
            const code = document.getElementById(editorId).value;
            const stdin = document.getElementById('input-data').value;
            const outputDiv = document.getElementById('output');

            if (!code.trim()) return;

            resetUI();
            setButtonsState(true, '実行中...');
            outputDiv.innerText = 'Paiza.IOサーバーに送信中...';

            try {
                // 1. 実行リクエストを送信 (Paiza.IO API)
                const createRes = await fetch("https://api.paiza.io/runners/create", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        source_code: code,
                        language: "cpp",
                        input: stdin,
                        api_key: "guest"
                    })
                });

                if (!createRes.ok) {
                    throw new Error(`HTTP Error: ${createRes.status}`);
                }

                const createData = await createRes.json();
                if (createData.error) {
                    throw new Error(createData.error);
                }
                
                const id = createData.id;
                outputDiv.innerText = '実行完了を待機中...';

                // 2. 実行完了を待機 (1秒ごとにポーリング)
                let status = "running";
                let details;
                while (status !== "completed") {
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    const getRes = await fetch(`https://api.paiza.io/runners/get_details?id=${id}&api_key=guest`);
                    details = await getRes.json();
                    status = details.status;
                }

                // 3. 結果の判定と表示
                if (details.build_result === "failure") {
                    // コンパイルエラー
                    outputDiv.classList.add('error');
                    outputDiv.innerText = "[コンパイルエラー]\n" + (details.build_stderr || "");
                } else if (details.result !== "success") {
                    // 実行時エラー (Timeout等含む)
                    outputDiv.classList.add('error');
                    outputDiv.innerText = "[実行時エラー]\n" + (details.stderr || "不明なエラー (メモリ超過/タイムアウトの可能性)");
                } else {
                    // 正常終了
                    outputDiv.classList.remove('error');
                    const rawOutput = details.stdout || "";
                    
                    // DEBUG:変数名=値 を抽出
                    const lines = rawOutput.split('\n');
                    let normalOutput = "";

                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        const match = line.match(/^DEBUG:([a-zA-Z_]\w*)=(.*)$/);
                        if (match) {
                            memoryVars[match[1]] = match[2];
                        } else {
                            if (i !== lines.length - 1 || line !== "") {
                                normalOutput += line + '\n';
                            }
                        }
                    }

                    outputDiv.innerText = normalOutput.trimEnd();
                    renderMemoryDOM();
                }

            } catch (err) {
                outputDiv.classList.add('error');
                outputDiv.innerText = "[通信エラー]\n" + err.message;
            } finally {
                setTimeout(() => {
                    setButtonsState(false);
                }, 1500);
            }
        }

        window.onload = function() {
            resetUI();
            setupEditor('code');
            setupEditor('sub-code1');
            setupEditor('sub-code2');
            setupEditor('sub-code3');
        };
    </script>
</body>
</html>
